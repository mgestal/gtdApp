<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GTD App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff7f7, #ffe6e8);
      color: #2a2a2a;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }
    .card {
      width: min(92vw, 360px);
      padding: 24px 18px;
      border-radius: 16px;
      border: 1px solid #f0d7d9;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: 0.02em;
    }
    .author {
      margin-top: 6px;
      margin-bottom: 0;
      font-size: 0.95rem;
      color: #7a6f73;
    }
    .loading {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #7a6f73;
    }
    a {
      color: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="{{ url_for('static', filename='icons/emoji-icon-192.png') }}?v=3" alt="Icono GTD App">
    <h1>GTD App</h1>
    <p class="author">Marcos Gestal</p>
    <p class="loading">Abriendo la aplicación...</p>
    <p><a href="{{ url_for('home') }}">Entrar ahora</a></p>
  </main>
  <script>
    setTimeout(function () {
      window.location.replace("{{ url_for('home') }}");
    }, 1200);
  </script>
</body>
</html>
