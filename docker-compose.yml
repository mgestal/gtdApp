version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gtd_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: gtd
      MYSQL_USER: gtd
      MYSQL_PASSWORD: gtd_password
    volumes:
      - ./sql/esquema.sql:/docker-entrypoint-initdb.d/esquema.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gtd_app
    environment:
      FLASK_ENV: production
    volumes:
      - ./instance:/app/instance
      - ./backups:/app/backups
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
