{% extends "base.html" %}
{% block content %}
  <div class="page-title">
    <h1>🏷️ Editar etiqueta</h1>
    <p class="subtitle">@{{ tag.name }}</p>
  </div>

  <div class="card">
    <form method="post" class="form">
      <input type="hidden" name="next" value="{{ next_url }}">

      <label class="label">Nombre</label>
      <input class="input" name="name" value="{{ tag.name }}" required>

      <label class="label">Tipo (opcional)</label>
      <select class="input" name="type_select">
        <option value="" {% if not tag.type %}selected{% endif %}>(sin tipo)</option>
        {% for tp in existing_tag_types %}
          <option value="{{ tp }}" {% if tag.type == tp %}selected{% endif %}>{{ tp }}</option>
        {% endfor %}
      </select>

      <label class="label" style="margin-top:8px;">Nuevo tipo (opcional)</label>
      <input class="input" name="type_new" value="" placeholder="persona, herramienta...">
      <div class="hint">Si rellenas "Nuevo tipo", tendrá prioridad sobre el desplegable.</div>

      <div class="row">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-soft" href="{{ next_url }}">Cancelar</a>
      </div>
    </form>
  </div>
{% endblock %}
