<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Entrar · GTD App</title>
  <link rel="manifest" href="{{ url_for('webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/emoji-icon-192.png') }}?v=3">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: linear-gradient(135deg, #fff7f7, #ffe6e8);
      color: #2a2a2a;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }
    .card {
      width: min(100%, 360px);
      padding: 24px 20px;
      border-radius: 16px;
      border: 1px solid #f0d7d9;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    .head { text-align: center; margin-bottom: 18px; }
    .logo { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
    h1 { margin: 10px 0 0; font-size: 1.5rem; }
    label { display: block; font-size: .9rem; font-weight: 600; margin: 14px 0 6px; }
    input[type=password], input[type=text] {
      width: 100%;
      padding: 11px 12px;
      font-size: 1rem;
      border: 1px solid #e3c6c9;
      border-radius: 10px;
      background: #fff;
    }
    input:focus { outline: 2px solid #e07a86; outline-offset: 1px; border-color: transparent; }
    #code { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
    .remember { display: flex; gap: 8px; align-items: center; font-weight: 400; margin-top: 14px; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border: 0;
      border-radius: 10px;
      background: #d9606f;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #c44f5e; }
    .flash { padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; font-size: .9rem;
             background: #fde8ea; border: 1px solid #f3b8bf; color: #8a1f2c; }
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <img class="logo" src="{{ url_for('static', filename='icons/emoji-icon-192.png') }}?v=3" alt="">
      <h1>GTD App</h1>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('auth_login') }}" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <label for="code">Código de la app de autenticación</label>
      <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7"
             autocomplete="one-time-code" placeholder="123456" required>
      <label class="remember"><input type="checkbox" name="remember" value="1" checked> Recordar este dispositivo</label>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
