<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sin conexion</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff7f7, #ffe6e8);
      color: #2a2a2a;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }
    main {
      width: min(92vw, 520px);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #f0d7d9;
      background: rgba(255, 255, 255, 0.92);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 14px; opacity: 0.85; }
    button {
      border: 1px solid #e8b2b7;
      border-radius: 12px;
      padding: 9px 14px;
      background: linear-gradient(180deg, #f3c4c8, #e7a7ad);
      cursor: pointer;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sin conexion</h1>
    <p>No hay red en este momento. Cuando vuelva la conexion, recarga para continuar.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
